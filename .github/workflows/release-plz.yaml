name: Release-plz

permissions:
  pull-requests: write
  contents: write

on:
  push:
    branches:
      - main

jobs:
  release-plz:
    name: Release-plz
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      # release-plz runs cargo-semver-checks without feature flags, which
      # enables `arc-slice` and `bytes` together and fails to build `rasn`.
      # Put a wrapper ahead of it on PATH that checks default features only.
      - name: Restrict cargo-semver-checks to default features
        run: echo "$GITHUB_WORKSPACE/.github/semver-checks-shim" >> "$GITHUB_PATH"
      - name: Run release-plz
        uses: MarcoIeni/release-plz-action@v0.5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
